{{ define "content" }}
<div class="mx-auto flex max-w-[560px] flex-col items-center gap-space-md py-16 text-center">

  <h1 class="text-headline-lg font-semibold tracking-tight text-foam">{{ t "landing.title" }}</h1>
  <p class="text-body-md text-muted">{{ t "landing.body" }}</p>
