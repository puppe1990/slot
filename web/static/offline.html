<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <meta name="theme-color" content="#1f8ba3" />
  </head>
  <body class="bg-ink text-foam min-h-screen flex items-center justify-center p-6">
    <div class="border border-copper/45 bg-ink/70 p-8 max-w-md text-center shadow-[10px_10px_0_0_rgba(31,139,163,0.22)]">
      <h1 class="font-serif text-2xl text-foam mb-2">You are offline</h1>
      <p class="text-foam/65 mb-6">Reconnect to load the latest content from the server.</p>
      <button
        onclick="location.reload()"
        class="bg-copper hover:bg-foam text-ink font-medium py-2 px-4"
      >
        Try again
      </button>
    </div>
  </body>
</html>
